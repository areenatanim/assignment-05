<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>GitHub Issues Tracker</title>
   <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

   <!-- daisyui and tailwind link -->
   <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <!-- google font  -->

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
   <!-- font awesome cdn -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />

   <style>
      * {
         font-family: "Geist", sans-serif;
      }

      /* .btn-primary {
         background-color: #3b82f6 !important;
         border-color: #3b82f6 !important;
         color: white !important;
      } */

      /* .btn-primary:hover {
         background-color: #2563eb !important;
      } */

      .card {
         transition: all 0.3s ease;
      }
   </style>
</head>

<body>
   <!-- nav bar section -->
   <header>
      <div class="navbar bg-[#ffffff] shadow-sm mb-12">
         <div class="flex-1">
            <div class="flex  items-center gap-[0] mx-6">
               <img src="./assets/github-logo.png" class="w-9" alt="">
               <a class=" text-2xl  sm:font-light sm:text-xl md:font-semibold">GitHub Issues Tracker</a>
            </div>
         </div>
         <div class="flex gap-2">
            <!-- search bar start -->
            <label class="input w-full max-w-md mb-6">
               <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
               </svg>
               <input id="search" type="search" placeholder="Search issues..." class="grow">
            </label>

            <button id="addBtn" class="btn bg-[#422ad5] text-white px-6 py-2 rounded-lg mb-6">
               <i class="fa-solid fa-plus mr-2"></i>New Issue
            </button>
         </div>
      </div>
   </header>

   <!-- main section -->
   <main id="main-container" class="w-11/12 mx-auto max-w-7xl">

      <!-- button section -->
      <section id="btn-section" class="mb-6">
         <div class="bg-white flex gap-4 shadow-sm p-4 rounded-lg">
            <div>
               <button id="all-btn" class="btn btn-outline btn-primary w-24">All</button>
            </div>
            <div id="open-btn">
               <button class="btn btn-outline btn-primary w-24">Open</button>
            </div>
            <div>
               <button id="close-btn" class="btn btn-outline btn-primary w-24">Close</button>
            </div>
         </div>
      </section>

      <!-- issues number section -->
      <section class="mb-6 bg-white shadow-lg rounded-xl overflow-hidden">
         <div class="p-6 flex justify-between items-center">
            <div class="flex items-center gap-4">
               <div class="p-0 bg-[#ece4ff] w-16 h-16 rounded-full flex items-center justify-center">
                  <img src="./assets/Aperture.png" class="w-10 h-10 rounded-full border-4 border-[#ece4ff]">
               </div>

               <div>
                  <h2 id="total-issues" class="font-semibold text-2xl">Loading...</h2>
                  <p class="font-medium text-lg text-[#65758b]">Track and manage your
                     project issues</p>
               </div>
            </div>
            <div class="flex gap-6">
               <h2 id="open-count" class="flex items-center gap-2 font-medium text-lg">
                  <div class="bg-[#2ba96e] w-3 h-3 rounded-full"></div>
                  Open <span class="font-bold text-xl">0</span>
               </h2>
               <h2 id="close-count" class="flex items-center gap-2 font-medium text-lg">
                  <div class="bg-[#a855f7] w-3 h-3 rounded-full"></div>
                  Close <span class="font-bold text-xl">0</span>
               </h2>
            </div>
         </div>
         <div class="divider"></div>

         <!-- Loading Spinner -->
         <div id="loadingSpinner" class="hidden flex justify-center items-center py-16">
            <div class="loading loading-spinner loading-lg text-primary"></div>
         </div>

         <!-- card section -->
         <div id="card-container" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be loaded here -->
         </div>
      </section>
   </main>
   <script src="./js/home.js"></script>
</body>

</html>
